name: Collect news

# Every 6 hours (05:30, 11:30, 17:30, 23:30 India time):
#   1. search today's news (Google News Tamil + English, GDELT) and check it
#   2. continue the 20-year history collection where the last run stopped
# Once the history is complete, each run only does step 1 (about 15 minutes).
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget for this run (minutes, max 330)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python -m collector run --minutes "${{ github.event.inputs.minutes || '300' }}"

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name  "news-collector-bot"
          git config user.email "news-collector-bot@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Collected news: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push
