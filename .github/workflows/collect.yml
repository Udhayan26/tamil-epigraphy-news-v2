name: Collect news

# Every morning at 05:15 India time (23:45 UTC the day before):
#   1. today's news (Google News Tamil + English, GDELT) and new research papers
#      (OpenAlex + Tamil journals), checked first
#   2. continue the history collection (newspaper archives, older papers)
# Once the history is complete, a run takes about 20-30 minutes.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget for this run (minutes, max 330)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python -m collector run --minutes "${{ github.event.inputs.minutes || '300' }}"

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name  "news-collector-bot"
          git config user.email "news-collector-bot@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Collected news: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push
