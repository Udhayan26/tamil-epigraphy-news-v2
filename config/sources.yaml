# News websites to backfill from the Wayback Machine URL index (CDX API).
# For each domain the collector lists every archived URL whose address contains
# one of the url_slug_terms in keywords.yaml, then opens each page to confirm
# the keywords really appear in the article.
#
# country: where the outlet is published (used for the "Source country" column)
# lang:    main language of the outlet (ta / en)
# from/to: years to cover

wayback:
  from_year: 2005
  to_year: 2026
  # Big newspapers are searched only in their Tamil Nadu / heritage sections
  # ("prefixes"): searching a whole big site times out at the web archive (HTTP 504).
  # Sites without "prefixes" are searched whole (fine for smaller sites).
  domains:
    # ---- English, India ----
    - domain: thehindu.com
      country: India
      lang: en
      prefixes: [news/national/tamil-nadu/, news/cities/Madurai/, news/cities/Tiruchirapalli/,
                 news/cities/Coimbatore/, news/cities/chennai/, news/cities/Puducherry/,
                 news/cities/Vellore/, society/history-and-culture/, entertainment/art/]
    - domain: frontline.thehindu.com
      country: India
      lang: en
      prefixes: [arts-and-culture/, the-nation/]
    - domain: newindianexpress.com
      country: India
      lang: en
      prefixes: [states/tamil-nadu/, cities/chennai/]
    - domain: dtnext.in
      country: India
      lang: en
      prefixes: [news/tamilnadu/, tamilnadu/, news/chennai/, chennai/]
    - domain: timesofindia.indiatimes.com
      country: India
      lang: en
      prefixes: [city/chennai/, city/madurai/, city/trichy/, city/coimbatore/, city/puducherry/,
                 city/salem/, city/vellore/]
    - domain: deccanherald.com
      country: India
      lang: en
      prefixes: [india/tamil-nadu/, south/tamil-nadu/]
    - domain: deccanchronicle.com
      country: India
      lang: en
      prefixes: [nation/current-affairs/, southern-states/tamil-nadu/]
    - domain: indianexpress.com
      country: India
      lang: en
      prefixes: [article/cities/chennai/, article/india/tamil-nadu/]
    - domain: ndtv.com
      country: India
      lang: en
      prefixes: [tamil-nadu-news/, chennai-news/]
    - domain: etvbharat.com
      country: India
      lang: en
      prefixes: [english/state/tamil-nadu/, english/bharat/, ta/state/, tamil/tamil-nadu/]
    - domain: indiatoday.in
      country: India
      lang: en
      prefixes: [india/tamil-nadu/, cities/chennai/]
    - {domain: thenewsminute.com,             country: India, lang: en}
    - {domain: theweek.in,                    country: India, lang: en}
    # ---- Tamil, India ----
    - domain: hindutamil.in
