# News websites to backfill from the Wayback Machine URL index (CDX API).
# For each domain the collector lists every archived URL whose address contains
# one of the url_slug_terms in keywords.yaml, then opens each page to confirm
# the keywords really appear in the article.
#
# country: where the outlet is published (used for the "Source country" column)
# lang:    main language of the outlet (ta / en)
# from/to: years to cover

wayback:
  from_year: 2005
  to_year: 2026
  domains:
    # ---- English, India ----
    - {domain: thehindu.com,                  country: India, lang: en}
    - {domain: hindu.com,                     country: India, lang: en}   # pre-2011 site
    - {domain: frontline.thehindu.com,        country: India, lang: en}
    - {domain: newindianexpress.com,          country: India, lang: en}
    - {domain: dtnext.in,                     country: India, lang: en}
    - {domain: timesofindia.indiatimes.com,   country: India, lang: en}
    - {domain: deccanherald.com,              country: India, lang: en}
    - {domain: deccanchronicle.com,           country: India, lang: en}
    - {domain: indianexpress.com,             country: India, lang: en}
    - {domain: ndtv.com,                      country: India, lang: en}
    - {domain: etvbharat.com,                 country: India, lang: en}
    - {domain: thehindubusinessline.com,      country: India, lang: en}
    - {domain: dailypioneer.com,              country: India, lang: en}
    - {domain: thestatesman.com,              country: India, lang: en}
    - {domain: theweek.in,                    country: India, lang: en}
    - {domain: indiatoday.in,                 country: India, lang: en}
    # ---- Tamil, India ----
