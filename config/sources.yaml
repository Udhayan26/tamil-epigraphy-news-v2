# Newspaper "archive by date" index pages. Each page lists that day's article
# titles; titles matching a keyword are queued and then verified.
# {y} {m} {d} are replaced with year, 2-digit month, 2-digit day.
# Experimental: if a site changes its layout this simply returns nothing.
date_archives:
  - name: The Hindu print archive
    url: "https://www.thehindu.com/archive/print/{y}/{m}/{d}/"
    country: India
    lang: en
    from: "2006-01-01"
    to: "2026-12-31"
    link_must_contain: "thehindu.com"

# Map top-level / country domains to a country when an article comes from a
# site not listed above (e.g. via GDELT or Google News).
