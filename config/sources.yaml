# Places mentioned in the article text are listed in a separate column so
# you can filter international finds.
places:
  - {name: Tamil Nadu,  terms: [tamil nadu, tamilnadu, தமிழ்நாடு, தமிழகம், தமிழகத்]}
  - {name: Puducherry,  terms: [puducherry, pondicherry, புதுச்சேரி, arikamedu]}
  - {name: Kerala,      terms: [kerala, கேரள, pattanam]}
  - {name: Karnataka,   terms: [karnataka, கர்நாடக]}
  - {name: Andhra / Telangana, terms: [andhra, telangana, ஆந்திர, தெலங்கான]}
  - {name: Sri Lanka,   terms: [sri lanka, இலங்கை, jaffna, யாழ்ப்பாண, anuradhapura, kantarodai]}
  - {name: Egypt,       terms: [egypt, எகிப்து, berenike, quseir, myos hormos]}
  - {name: Oman,        terms: [oman, ஓமன், khor rori]}
  - {name: Thailand,    terms: [thailand, தாய்லாந்து, khuan luk pat, phu khao thong]}
  - {name: Malaysia,    terms: [malaysia, மலேசிய, bujang, kedah]}
  - {name: Indonesia,   terms: [indonesia, இந்தோனேசிய, sumatra, java]}
  - {name: Vietnam,     terms: [vietnam, வியட்நாம்]}
  - {name: Myanmar,     terms: [myanmar, burma, மியான்மர்]}
  - {name: China,       terms: [china, quanzhou, சீன]}
  - {name: Cambodia,    terms: [cambodia, கம்போடிய, angkor]}


# Research papers and journal articles.
papers:
  from_year: 2000
  # Open-access journals harvested through their OAI-PMH address (standard in OJS
  # journal software: <journal site>/index.php/<journal>/oai). Add more the same way.
  journals:
    - name: International Research Journal of Tamil
      oai: https://irjt.iorpress.org/index.php/irjt/oai
    - name: Shanlax International Journal of Tamil Research
      oai: https://www.shanlaxjournals.in/journals/index.php/tamil/oai
    - name: Tamil Peraivu (University of Malaya)
      oai: https://tamilperaivu.um.edu.my/index.php/tamilperaivu/oai
