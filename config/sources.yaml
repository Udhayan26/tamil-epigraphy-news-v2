    - {domain: tamil.thehindu.com,            country: India, lang: ta}   # old Hindu Tamil
    - {domain: dinamani.com,                  country: India, lang: ta}
    - {domain: dinamalar.com,                 country: India, lang: ta}
    - {domain: dailythanthi.com,              country: India, lang: ta}
    - {domain: maalaimalar.com,               country: India, lang: ta}
    - {domain: vikatan.com,                   country: India, lang: ta}
    - {domain: tamil.oneindia.com,            country: India, lang: ta}
    - {domain: tamil.news18.com,              country: India, lang: ta}
    - {domain: tamil.samayam.com,             country: India, lang: ta}
    - {domain: puthiyathalaimurai.com,        country: India, lang: ta}
    - {domain: tamil.indianexpress.com,       country: India, lang: ta}
    - {domain: tamil.etvbharat.com,           country: India, lang: ta}
    - {domain: kalkionline.com,               country: India, lang: ta}
    - {domain: bbc.com,                       country: UK,    lang: ta, path_prefix: "bbc.com/tamil"}
    # ---- Sri Lanka ----
    - {domain: dailymirror.lk,                country: Sri Lanka, lang: en}
