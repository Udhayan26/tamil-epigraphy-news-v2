    - 'கல்வெட்டு கண்டெடுப்பு'
    - 'கல்வெட்டு கண்டுபிடிப்பு'
    - 'சோழர் கால கல்வெட்டு'
    - 'பாண்டியர் கால கல்வெட்டு'
    - 'பல்லவர் கால கல்வெட்டு'
    - 'விஜயநகர கால கல்வெட்டு'
    - 'தமிழ் பிராமி கல்வெட்டு'
