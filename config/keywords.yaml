# Search queries used for GDELT and Google News (title/full-text search engines).
# Kept shorter than the full keyword list to stay within API limits.
search_queries:
  en:
    - '"hero stone" Tamil'
    - '"Tamil-Brahmi"'
    - '"Tamil Brahmi" inscription'
    - 'inscription Tamil Nadu'
    - 'Chola inscription'
    - 'Pandya inscription'
    - 'Pallava inscription'
    - 'Vatteluttu'
    - '"copper plates" Tamil'
    - '"rock art" Tamil Nadu'
    - '"rock paintings" Tamil Nadu'
    - 'Keeladi'
    - 'Adichanallur'
    - 'Sivakalai'
    - 'Tamil Nadu archaeology excavation'
    - 'Tamil inscription Sri Lanka'
    - 'Tamil inscription Egypt'
    - 'Tamil inscription Thailand'
    - 'Tamil inscription Oman'
    - 'Tamil inscription China'
    - 'Tamil inscription Indonesia'
    - 'Tamil inscription Malaysia Bujang'
    - 'Tamil inscription Vietnam'
    - 'hero stone discovered'
    - 'hero stones found Krishnagiri'
    - 'memorial stone inscription Tamil'
    - 'Vijayanagara inscription Tamil Nadu'
    - 'Jain beds Tamil-Brahmi'
    - 'Tamil Nadu State Department of Archaeology'
    - 'Porunai civilisation'
    - 'Kodumanal excavation'
  ta:
    # Natural Tamil headline phrases work best on Google News Tamil.
    - 'நடுகல் கண்டுபிடிப்பு'
    - 'நடுகல் கண்டெடுப்பு'
